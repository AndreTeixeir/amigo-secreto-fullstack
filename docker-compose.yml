version: '3.8'

services:
  # Backend Spring Boot
  backend:
    build: ./backend
    container_name: amigo-secreto-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - TNS_ADMIN=/app/wallet
      - DB_USERNAME=${DB_USERNAME:-ADMIN}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-minha-chave-secreta-super-segura-123}
    volumes:
      - ./wallet:/app/wallet:ro
    networks:
      - amigo-secreto-network
    restart: unless-stopped

  # Frontend (Nginx)
  frontend:
    image: nginx:alpine
    container_name: amigo-secreto-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - amigo-secreto-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  amigo-secreto-network:
    driver: bridge

