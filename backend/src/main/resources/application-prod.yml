spring:
  datasource:
    url: jdbc:oracle:thin:@${DB_CONNECTION_STRING}?TNS_ADMIN=${TNS_ADMIN}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# CORS - Configurar com domínio de produção
cors:
  allowed-origins: ${ALLOWED_ORIGINS:https://seu-dominio.com}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# JWT - Usar secret forte em produção
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    root: WARN
    com.amigosecreto: INFO
    org.springframework.security: WARN

